<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Lusion 唯美绘本风 3D 童话小镇</title>
  <style>
    /* ===== 全局基础样式 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #eef4ee; }
    body { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    canvas { display: block; touch-action: none; }

    /* ===== 顶部标题 ===== */
    #title {
      position: fixed; top: 18px; left: 22px; z-index: 10;
      color: #5c6b52; text-shadow: 0 1px 2px rgba(255,255,255,.6);
      pointer-events: none; user-select: none;
    }
    #title h1 { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
    #title p  { font-size: 12px; margin-top: 4px; opacity: .8; }
    /* ===== 右侧控制面板 ===== */
    #panel {
      position: fixed; top: 18px; right: 22px; z-index: 10;
      display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .btn {
      padding: 7px 14px; font-size: 13px; cursor: pointer; border: 1px solid rgba(255,255,255,.7);
      background: rgba(255,255,255,.72); color: #55614c; border-radius: 999px;
      backdrop-filter: blur(4px); transition: all .18s ease; user-select: none;
      box-shadow: 0 2px 8px rgba(90,100,70,.12);
    }
    .btn:hover { background: #fff; color: #3f4a39; transform: translateY(-1px); }
    .btn.active { background: #7d9a72; color: #fff; border-color: #7d9a72; }
    .group-label {
      font-size: 11px; color: #6d7a63; margin: 2px 10px 0 0; align-self: center;
    }

    /* ===== 底部操作提示 ===== */
    #hint {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 10; text-align: center; color: #5c6b52;
      background: rgba(255,255,255,.7); padding: 8px 18px; border-radius: 999px;
      font-size: 13px; backdrop-filter: blur(4px); pointer-events: none; user-select: none;
      box-shadow: 0 2px 8px rgba(90,100,70,.12);
      transition: opacity .4s ease;
    }
    #hint b { color: #3f4a39; }

    /* ===== 加载遮罩 ===== */
    #loader {
      position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: linear-gradient(160deg, #f4f1e8, #e8efe4);
      transition: opacity .8s ease; color: #6d7a63; font-size: 14px; letter-spacing: 2px;
    }
    #loader.hide { opacity: 0; pointer-events: none; }
    .dots { display: flex; gap: 8px; }
    .dots span {
      width: 10px; height: 10px; border-radius: 50%;
      background: #9db392; animation: bounce 1.2s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay: .15s; }
    .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,100% { transform: translateY(0); opacity:.5 } 50% { transform: translateY(-8px); opacity:1 } }

    /* ===== 手绘文字弹窗（射线拾取反馈） ===== */
    #popup {
      position: fixed; z-index: 30; max-width: 240px; padding: 10px 16px;
      background: rgba(255, 251, 240, .92); border: 2px solid #d8c9a8;
      border-radius: 14px 14px 14px 4px;
      box-shadow: 0 6px 18px rgba(100, 90, 60, .18);
      color: #6b5b3f; font-size: 15px; line-height: 1.55; white-space: pre-line;
      font-family: "Kaiti SC", "KaiTi", "STKaiti", "Comic Sans MS", cursive;
      pointer-events: none; user-select: none; opacity: 0;
      transform: translateY(6px) rotate(-1.5deg) scale(.92);
      transition: opacity .22s ease, transform .22s ease;
    }
    #popup.show { opacity: 1; transform: translateY(0) rotate(-1.5deg) scale(1); }
    #popup::before {
      content: ""; position: absolute; left: 14px; bottom: -8px;
      width: 14px; height: 14px; background: rgba(255, 251, 240, .92);
      border-right: 2px solid #d8c9a8; border-bottom: 2px solid #d8c9a8;
      transform: rotate(45deg); border-radius: 0 0 3px 0;
    }

    /* ===== 展品详情面板（虚拟展厅/艺术馆 · 点击展品查看详细介绍） ===== */
    #galleryPanel {
      position: fixed; inset: 0; z-index: 40; display: none;
      align-items: center; justify-content: center;
      background: rgba(60, 70, 55, .35); backdrop-filter: blur(3px);
    }
    #galleryPanel.show { display: flex; }
    .gp-card {
      width: min(640px, 92vw); max-height: 86vh; overflow: auto;
      background: #fdf8ec; border: 3px solid #d8c9a8;
      border-radius: 20px 20px 20px 6px;
      box-shadow: 0 18px 50px rgba(60, 60, 40, .35);
      padding: 24px; display: flex; gap: 22px; flex-wrap: wrap;
      font-family: "Kaiti SC", "KaiTi", "STKaiti", serif;
      transform: translateY(14px) rotate(-.6deg); transition: transform .28s ease;
    }
    #galleryPanel.show .gp-card { transform: translateY(0) rotate(-.6deg); }
    .gp-art {
      flex: 1 1 240px; min-width: 0; align-self: flex-start;
      border: 7px solid #fff; outline: 2px solid #d8c9a8;
      border-radius: 8px; background: #fff; box-shadow: 0 4px 14px rgba(90,80,50,.14);
    }
    .gp-art canvas { width: 100%; height: auto; display: block; border-radius: 4px; }
    .gp-body { flex: 1 1 230px; min-width: 0; }
    .gp-body h2 { font-size: 25px; color: #6b5b3f; margin: 4px 0 12px; letter-spacing: 3px; }
    .gp-body p { font-size: 16px; line-height: 1.95; color: #7a6a4c; }
    .gp-tag {
      display: inline-block; margin-top: 12px; font-size: 12px; color: #9a8a68;
      border: 1px solid #d8c9a8; border-radius: 999px; padding: 3px 12px;
    }
    #gpClose {
      margin-top: 18px; padding: 9px 22px; font-size: 15px; cursor: pointer;
      background: #7d9a72; color: #fff; border: none; border-radius: 999px;
      font-family: inherit; box-shadow: 0 3px 10px rgba(90,100,70,.2);
      transition: all .18s ease;
    }
    #gpClose:hover { background: #6d8a62; transform: translateY(-1px); }

    /* ===== 移动端触屏控件（仅触屏设备创建/显示） ===== */
    #joyBase {
      position: fixed; z-index: 25; width: 110px; height: 110px;
      border-radius: 50%; border: 2px solid rgba(255,255,255,.55);
      background: rgba(255,255,255,.18); backdrop-filter: blur(2px);
      display: none; align-items: center; justify-content: center;
      transform: translate(-50%, -50%); pointer-events: none;
    }
    #joyKnob {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,.75); box-shadow: 0 2px 8px rgba(80,90,60,.25);
    }
    #jumpBtn {
      position: fixed; z-index: 25; right: 26px; bottom: 40px;
      width: 62px; height: 62px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.7); background: rgba(255,255,255,.55);
      color: #4a5a3e; font-size: 22px; line-height: 1; cursor: pointer;
      backdrop-filter: blur(3px); box-shadow: 0 3px 10px rgba(80,90,60,.2);
      user-select: none; -webkit-user-select: none; touch-action: none;
    }
    #jumpBtn:active { background: #7d9a72; color: #fff; }
    /* 非触屏设备隐藏移动端控件 */
    @media (hover: hover) and (pointer: fine) {
      #joyBase, #jumpBtn { display: none !important; }
    }

    /* ===== 准星 & 交互光标（FPS 锁定后显示，命中可交互物高亮） ===== */
    #crosshair {
      position: fixed; left: 50%; top: 50%; width: 22px; height: 22px;
      transform: translate(-50%, -50%); z-index: 40; pointer-events: none;
      display: none; opacity: 0; transition: opacity .15s ease, transform .15s ease;
    }
    #crosshair.show { display: block; opacity: .92; }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: #fff8e8; border-radius: 2px;
      box-shadow: 0 0 2px rgba(90,80,60,.55), 0 0 6px rgba(90,80,60,.22);
    }
    #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
    #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
    #crosshair .ch-dot {
      position: absolute; left: 50%; top: 50%; width: 4px; height: 4px;
      transform: translate(-50%, -50%); border-radius: 50%;
      background: #fff8e8; box-shadow: 0 0 3px rgba(90,80,60,.55);
    }
    #crosshair.hit { transform: translate(-50%, -50%) scale(1.28); }
    #crosshair.hit::before, #crosshair.hit::after, #crosshair.hit .ch-dot { background: #ffd76a; }
    #crosshairLabel {
      position: fixed; left: 50%; top: 57%; transform: translateX(-50%);
      z-index: 40; pointer-events: none; display: none;
      padding: 3px 12px; border-radius: 999px; white-space: nowrap;
      background: rgba(253,248,236,.92); border: 1.5px solid #d8c9a8;
      color: #6b5b3f; font-size: 12px; letter-spacing: 1px;
    }
    #crosshairLabel.show { display: block; }

    /* ===== 寻物任务 HUD（星光信物） ===== */
    .hidden { display: none !important; }
    #questToast {
      position: fixed; top: 78px; left: 50%; transform: translateX(-50%) translateY(-8px);
      z-index: 45; padding: 9px 22px; border-radius: 999px;
      background: rgba(253,248,236,.95); border: 2px solid #d8c9a8;
      color: #6b5b3f; font-size: 14px; letter-spacing: 1px; white-space: nowrap;
      box-shadow: 0 4px 14px rgba(100,90,60,.16);
      opacity: 0; pointer-events: none; transition: all .3s ease;
    }
    #questToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #questCard {
      position: fixed; left: 20px; bottom: 92px; z-index: 35;
      background: rgba(253,248,236,.92); border: 2px solid #d8c9a8;
      border-radius: 14px 14px 14px 4px; padding: 10px 16px;
      color: #6b5b3f; box-shadow: 0 4px 14px rgba(100,90,60,.14);
      transform: rotate(-.6deg); user-select: none;
    }
    #questCard .qc-title { font-size: 14px; font-weight: 700; letter-spacing: 2px; }
    #questCard .qc-sub { font-size: 12px; margin-top: 4px; color: #8a7a5c; }
    #questCard .qc-sub b { color: #7d9a72; font-size: 14px; }
    #hotbar {
      position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%);
      z-index: 35; display: none; gap: 8px; padding: 7px 9px;
      background: rgba(253,248,236,.85); border: 2px solid #d8c9a8; border-radius: 14px;
      box-shadow: 0 4px 16px rgba(100,90,60,.16);
    }
    #hotbar.show { display: flex; }
    #hotbar .slot {
      position: relative; width: 52px; height: 52px; border-radius: 10px;
      background: rgba(255,252,242,.65); border: 2px dashed #cbb98e;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s ease;
    }
    #hotbar .slot .key { display: none; }
    #hotbar .slot canvas { width: 84%; height: 84%; object-fit: contain; opacity: 0; transform: scale(.4); transition: all .25s ease; }
    #hotbar .slot.filled { border-style: solid; border-color: #7d9a72; background: #f3f8ee; box-shadow: 0 0 10px rgba(125,154,114,.35); }
    #hotbar .slot.filled canvas { opacity: 1; transform: scale(1); }
    #dialog {
      position: fixed; left: 50%; bottom: 152px; transform: translateX(-50%);
      z-index: 42; width: min(560px, 92vw); cursor: pointer;
      background: rgba(255,251,240,.95); border: 3px solid #d8c9a8;
      border-radius: 18px 18px 18px 6px; padding: 16px 20px 12px;
      box-shadow: 0 10px 30px rgba(100,90,60,.2);
    }
    #dialog .dlg-name { font-size: 13px; color: #9a8a68; letter-spacing: 2px; margin-bottom: 6px; }
    #dialog .dlg-name b { color: #7d9a72; }
    #dialog .dlg-text { font-size: 16px; line-height: 1.8; color: #6b5b3f; font-family: "Kaiti SC","KaiTi","STKaiti",serif; }
    #dialog .dlg-next { margin-top: 8px; font-size: 12px; color: #b3a27e; text-align: right; }
    #winOverlay {
      position: fixed; inset: 0; z-index: 60; display: none;
      align-items: center; justify-content: center;
      background: rgba(60,70,55,.4); backdrop-filter: blur(4px);
    }
    #winOverlay.show { display: flex; }
    .win-card {
      width: min(520px, 92vw); background: #fdf8ec; border: 3px solid #d8c9a8;
      border-radius: 20px 20px 20px 6px; padding: 28px 30px;
      box-shadow: 0 18px 50px rgba(60,60,40,.35); text-align: center;
      font-family: "Kaiti SC","KaiTi","STKaiti",serif; transform: rotate(-.5deg);
    }
    .win-card h2 { font-size: 26px; color: #6b5b3f; letter-spacing: 3px; margin: 0 0 6px; }
    .win-card .win-sub { font-size: 14px; color: #9a8a68; margin-bottom: 18px; }
    #winList { display: flex; justify-content: center; gap: 16px; margin: 14px 0 18px; }
    #winList .win-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    #winList .win-item canvas { width: 52px; height: 52px; }
    #winList .win-item span { font-size: 12px; color: #7a6a4c; }
    #winTime { font-size: 13px; color: #9a8a68; margin: 0 0 16px; }
    #btnRestart {
      padding: 10px 26px; font-size: 16px; cursor: pointer;
      background: #7d9a72; color: #fff; border: none; border-radius: 999px;
      font-family: inherit; box-shadow: 0 3px 10px rgba(90,100,70,.2); transition: all .18s ease;
    }
    #btnRestart:hover { background: #6d8a62; transform: translateY(-1px); }
    @media (max-width: 700px) {
      #hotbar .slot { width: 46px; height: 46px; }
      #dialog { bottom: 132px; }
      #questCard { bottom: 76px; }
    }
  </style>
  <!--
    import map：GitHub Pages 直接托管源码时，浏览器需要它才能解析裸模块名 "three"。
    版本与 package.json 中 three 的安装版本保持一致（0.185.1）。
    使用 Vite 构建部署时该映射不会生效（three 已被打包进产物），无副作用。
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- 加载遮罩 -->
  <div id="loader">
    <div class="dots"><span></span><span></span><span></span></div>
    <div>正在绘制童话小镇…</div>
  </div>

  <!-- 右侧控制面板 -->
  <div id="panel">
    <div class="row">
      <span class="group-label">氛围</span>
      <button class="btn active" data-atmo="day">☀ 白天</button>
      <button class="btn" data-atmo="dusk">🌇 黄昏</button>
      <button class="btn" data-atmo="night">🌙 夜晚</button>
      <button class="btn" id="btnAuto">⏱ 自动流转</button>
    </div>
    <div class="row">
      <span class="group-label">视角</span>
      <button class="btn active" data-view="fps">🚶 漫游</button>
      <button class="btn" data-view="orbit">🔭 俯视</button>
    </div>
  </div>

  <!-- 底部操作提示 -->
  <div id="hint">
    点击画面锁定鼠标 · <b>W A S D</b> 移动 · <b>空格</b> 跳跃 · <b>E</b> 互动 · <b>滚轮</b> 缩放 · <b>Shift</b> 加速
  </div>

  <!-- 展品详情面板（虚拟展厅/艺术馆 · 射线投射点击展品查看详细介绍） -->
  <div id="galleryPanel">
    <div class="gp-card">
      <div class="gp-art" id="gpArt"></div>
      <div class="gp-body">
        <h2 id="gpTitle"></h2>
        <p id="gpDesc"></p>
        <span class="gp-tag">📌 绘本画廊 · 虚拟展厅展品</span>
        <br/>
        <button id="gpClose">✕ 收起介绍</button>
      </div>
    </div>
  </div>

  <!-- ===== 寻物任务 HUD（星光信物） ===== -->
  <div id="crosshair"><span class="ch-dot"></span></div>
  <div id="crosshairLabel"></div>
  <div id="questToast"></div>
  <div id="questCard" class="hidden">
    <div class="qc-title">守林人的请求</div>
    <div class="qc-sub">找回星光信物 <b id="qcCount">0/4</b></div>
  </div>
  <div id="hotbar">
    <div class="slot"><span class="key">1</span></div>
    <div class="slot"><span class="key">2</span></div>
    <div class="slot"><span class="key">3</span></div>
    <div class="slot"><span class="key">4</span></div>
  </div>
  <div id="dialog" class="hidden">
    <div class="dlg-name"><b>守林人 · 老橡</b></div>
    <div class="dlg-text" id="dlgText"></div>
    <div class="dlg-next" id="dlgNext">按 E / 点击 继续</div>
  </div>
  <div id="winOverlay">
    <div class="win-card">
      <h2>小镇的星光回来了！</h2>
      <div class="win-sub">你找齐了全部 4 件星光信物</div>
      <div id="winList"></div>
      <p id="winTime"></p>
      <button id="btnRestart">再玩一次</button>
    </div>
  </div>

  <!-- 调试用错误显示（可随时删除） -->
  <script>
    function showErr(msg) {
      const d = document.createElement('div');
      d.style.cssText = 'position:fixed;left:10px;top:10px;z-index:9999;background:#300;color:#fdd;padding:10px;font:12px/1.5 monospace;white-space:pre-wrap;max-width:85vw;max-height:60vh;overflow:auto';
      d.textContent = msg;
      document.body.appendChild(d);
    }
    window.addEventListener('error', (e) => showErr('ERROR: ' + (e.message || (e.error && e.error.stack) || String(e.error))));
    window.addEventListener('unhandledrejection', (e) => showErr('REJECT: ' + String((e.reason && e.reason.stack) || e.reason)));
  </script>

  <!-- 入口脚本 -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
